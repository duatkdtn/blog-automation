name: 한발뉴스24 자동 발송 + WordPress 발행

on:
  schedule:
    - cron: '0 20 * * *'  # 매일 UTC 20:00 = 한국시간 05:00
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write

jobs:
  hanbal-news:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한국어 폰트 설치 (썸네일용)
        run: sudo apt-get install -y fonts-nanum

      - name: 패키지 설치
        run: pip install anthropic requests pillow google-auth google-auth-oauthlib google-auth-httplib2

      - name: 한발뉴스24 실행 (뉴스 수집 + AI 분류 + 이메일)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: "duatkdtn@gmail.com"
        run: python hanbal_main.py

      - name: 결과 파일 저장소에 커밋
        run: |
          git config user.email "duatkdtn@gmail.com"
          git config user.name "duatkdtn"
          git add hanbal_result_*.json || true
          git diff --staged --quiet || git commit -m "한발뉴스24 결과 저장 $(date +%Y-%m-%d)"
          git push || true

      - name: WordPress 자동 발행
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: "duatkdtn@gmail.com"
          WP_URL: "https://hijaneeinfo.com"
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python wp_auto_publish.py
